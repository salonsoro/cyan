name: CI

on:
  push:
  pull_request:

jobs:
  macos_build:
    runs-on: xcode-27

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
      
      - name: Install LLVM
        run: /bin/zsh -i -c "brew install llvm"
        shell: bash
      
      - name: Install LLD
        run: /bin/zsh -i -c "brew install lld"
        shell: bash

      - name: CMake Clang debug configuration
        run: /bin/zsh -i -c "cmake -B Build/Debug -S . -G Ninja -D BUILD_TESTING=On -D BUILD_BENCHMARKING=On -D CMAKE_BUILD_TYPE=Debug -D CMAKE_CXX_COMPILER=/opt/homebrew/opt/llvm/bin/clang++ -D CMAKE_LINKER=/opt/homebrew/opt/lld/bin/lld"
        shell: bash

      - name: CMake Clang debug build
        run: /bin/zsh -i -c "cmake --build Build/Debug --target CYAN_RUN_TESTS"
        shell: bash

      - name: CMake Clang debug benchmarks
        run: /bin/zsh -i -c "cmake --build Build/Debug --target CYAN_RUN_BENCHMARKS"
        shell: bash

      - name: CMake Clang release with debug information configuration
        run: /bin/zsh -i -c "cmake -B Build/RDI -S . -G Ninja -D BUILD_BENCHMARKING=On -D CMAKE_BUILD_TYPE=RelWithDebInfo -D CMAKE_CXX_COMPILER=/opt/homebrew/opt/llvm/bin/clang++ -D CMAKE_LINKER=/opt/homebrew/opt/lld/bin/lld"
        shell: bash

      - name: CMake Clang release with debug information benchmarks
        run: /bin/zsh -i -c "cmake --build Build/RDI --target CYAN_RUN_BENCHMARKS"
        shell: bash

      - name: CMake Clang release configuration
        run: /bin/zsh -i -c "cmake -B Build/Release -S . -G Ninja -D BUILD_TESTING=On -D BUILD_BENCHMARKING=On -D CMAKE_BUILD_TYPE=Release -D CMAKE_CXX_COMPILER=/opt/homebrew/opt/llvm/bin/clang++ -D CMAKE_LINKER=/opt/homebrew/opt/lld/bin/lld"
        shell: bash

      - name: CMake Clang release build
        run: /bin/zsh -i -c "cmake --build Build/Release --target CYAN_RUN_TESTS"
        shell: bash

      - name: CMake Clang release benchmarks
        run: /bin/zsh -i -c "cmake --build Build/Release --target CYAN_RUN_BENCHMARKS"
        shell: bash

  windows_build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Setup MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.1
        with:
          arch: x64

      - name: CMake MSVC debug configuration
        run: cmake -B Build/Debug -S . -G Ninja -D BUILD_TESTING=On -D BUILD_BENCHMARKING=On -D CMAKE_BUILD_TYPE=Debug -D CMAKE_CXX_COMPILER=cl -D CMAKE_LINKER=link
        shell: powershell

      - name: CMake MSVC debug tests
        run: cmake --build Build/Debug --target CYAN_RUN_TESTS
        shell: powershell
      
      - name: CMake MSVC debug benchmarks
        run: cmake --build Build/Debug --target CYAN_RUN_BENCHMARKS
        shell: powershell

      - name: CMake MSVC release with debug information configuration
        run: cmake -B Build/RDI -S . -G Ninja -D BUILD_BENCHMARKING=On -D CMAKE_BUILD_TYPE=RelWithDebInfo -D CMAKE_CXX_COMPILER=cl -D CMAKE_LINKER=link
        shell: powershell
      
      - name: CMake MSVC release with debug information benchmarks
        run: cmake --build Build/RDI --target CYAN_RUN_BENCHMARKS
        shell: powershell

      - name: CMake MSVC release configuration
        run: cmake -B Build/Release -S . -G Ninja -D BUILD_TESTING=On -D BUILD_BENCHMARKING=On -D CMAKE_BUILD_TYPE=Release -D CMAKE_CXX_COMPILER=cl -D CMAKE_LINKER=link
        shell: powershell

      - name: CMake MSVC release tests
        run: cmake --build Build/Release --target CYAN_RUN_TESTS
        shell: powershell
      
      - name: CMake MSVC release benchmarks
        run: cmake --build Build/Release --target CYAN_RUN_BENCHMARKS
        shell: powershell

  linux_build:
    runs-on: ubuntu-26.04

    container:
      image: archlinux:latest
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Initialize key
        run: |
          pacman-key --init
          pacman-key --populate archlinux
        shell: bash
      
      - name: Update system
        run: pacman -Syu --noconfirm
        shell: bash

      - name: Install base
        run: pacman -S --noconfirm base-devel
        shell: bash

      - name: Install CMake
        run: pacman -S --noconfirm cmake
        shell: bash

      - name: Install Ninja
        run: pacman -S --noconfirm ninja
        shell: bash
      
      - name: CMake GCC debug configuration
        run: cmake -B Build/Debug -S . -G Ninja -D BUILD_TESTING=On -D BUILD_BENCHMARKING=On -D CMAKE_BUILD_TYPE=Debug
        shell: bash

      - name: CMake GCC debug tests
        run: cmake --build Build/Debug --target CYAN_RUN_TESTS
        shell: bash

      - name: CMake GCC debug benchmarks
        run: cmake --build Build/Debug --target CYAN_RUN_BENCHMARKS
        shell: bash

      - name: CMake GCC release with debug information configuration
        run: cmake -B Build/RDI -S . -G Ninja -D BUILD_BENCHMARKING=On -D CMAKE_BUILD_TYPE=RelWithDebInfo
        shell: bash

      - name: CMake GCC release with debug information benchmarks
        run: cmake --build Build/RDI --target CYAN_RUN_BENCHMARKS
        shell: bash

      - name: CMake GCC release configuration
        run: cmake -B Build/Release -S . -G Ninja -D BUILD_TESTING=On -D BUILD_BENCHMARKING=On -D CMAKE_BUILD_TYPE=Release
        shell: bash

      - name: CMake GCC release tests
        run: cmake --build Build/Release --target CYAN_RUN_TESTS
        shell: bash

      - name: CMake GCC release benchmarks
        run: cmake --build Build/Release --target CYAN_RUN_BENCHMARKS
        shell: bash